<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="wheel.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="wheel">
        <defs>
          <linearGradient id="hotFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff9a5c" />
            <stop offset="1" stop-color="#e2561c" />
          </linearGradient>
          <radialGradient id="rimShade" cx="0.5" cy="0.35" r="0.7">
            <stop class="gloss-a" offset="0" />
            <stop class="gloss-b" offset="1" />
          </radialGradient>
        </defs>
        <!-- shapes are drawn by wheel.js: a full wheel, or a half wheel next to the shelf -->
        <path id="rim" class="rim" />
        <path id="rimGloss" class="rim-gloss" />
        <g id="slices"></g>
        <path id="hubWell" class="hub-well" />
        <path id="hub" class="hub" />
      </svg>
      <div id="hubPill"></div>
      <div id="caption"></div>
    </div>
    <script src="wheel.js"></script>
  </body>
</html>
