<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="prompt.css" />
  </head>
  <body>
    <form id="card" autocomplete="off">
      <div class="head">
        <div class="icon">
          <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" /><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" /></svg>
        </div>
        <div>
          <h1 id="title"></h1>
          <p id="message"></p>
        </div>
      </div>
      <div class="field">
        <input id="pw" type="password" placeholder="Password" spellcheck="false" />
        <button type="button" id="peek" title="Show password">Show</button>
      </div>
      <div class="field" id="confirmRow" hidden>
        <input id="pw2" type="password" placeholder="Type it again" spellcheck="false" />
      </div>
      <p id="error"></p>
      <div class="buttons">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="ok">OK</button>
      </div>
    </form>
    <script src="prompt.js"></script>
  </body>
</html>
