<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="wheel.css" />
  </head>
  <body>
    <div id="stage">
      <svg id="wheel" viewBox="0 0 360 360" width="360" height="360">
        <defs>
          <linearGradient id="hotFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff9a5c" />
            <stop offset="1" stop-color="#e2561c" />
          </linearGradient>
          <radialGradient id="rimShade" cx="0.5" cy="0.35" r="0.7">
            <stop class="gloss-a" offset="0" />
            <stop class="gloss-b" offset="1" />
          </radialGradient>
        </defs>
        <circle class="rim" cx="180" cy="180" r="166" />
        <circle class="rim-gloss" cx="180" cy="180" r="166" />
        <g id="slices"></g>
        <circle class="hub-well" cx="180" cy="180" r="60" />
        <circle id="hub" class="hub" cx="180" cy="180" r="52" />
      </svg>
      <div id="hubPill"></div>
      <div id="caption"></div>
    </div>
    <script src="wheel.js"></script>
  </body>
</html>
